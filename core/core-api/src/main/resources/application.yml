server:
  port: 0
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

spring:
  application:
    name: asset-service
  config:
    import:
      - logging.yml
      - monitoring.yml
      - core-domain.yml
      - storage-db-core.yml
  web.resources.add-mappings: false

---
spring.config.activate.on-profile: local

server:
  port: 9040

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

---
spring.config.activate.on-profile: local-dev
